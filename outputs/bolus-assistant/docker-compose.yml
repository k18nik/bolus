name: bolus-assistant
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bolus
      POSTGRES_USER: bolus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bolus -d bolus']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bolus:${POSTGRES_PASSWORD}@postgres:5432/bolus
      REDIS_URL: redis://redis:6379/0
      REPORT_DIR: /data/reports
      TASK_ALWAYS_EAGER: 'false'
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log']
    volumes:
      - report_data:/data/reports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bolus:${POSTGRES_PASSWORD}@postgres:5432/bolus
      REDIS_URL: redis://redis:6379/0
      REPORT_DIR: /data/reports
      TASK_ALWAYS_EAGER: 'false'
    command: [celery, -A, app.reports.tasks:celery, worker, --loglevel=WARNING, --concurrency=2]
    volumes:
      - report_data:/data/reports
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  report_data:
